[project]
name = "interviewloop"
version = "0.1.0"
description = "Multi-agent mock-interview panel built on LangChain + LangGraph."
authors = [{ name = "Samer Ayman Onaj" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langsmith>=0.1.140",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "gradio>=4.44.0",
    "typer>=0.12.5",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
interviewloop = "interviewloop.cli:app"
interviewloop-ui = "interviewloop.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
